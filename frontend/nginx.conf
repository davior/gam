upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `^~` so the static-asset regex below cannot shadow a media URL ending .png/.jpg.
    # Media is authenticated by a signed query parameter, so it must still reach the
    # backend rather than being served off disk.
    location ^~ /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests are what let a long video scrub instead of downloading whole.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # Safe to cache hard: a media key is a UUID and its bytes never change. The
        # signature limits the window, not the content.
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size ${UPLOAD_MAX_SIZE};
        # Stream a large upload straight through instead of spooling it to disk first.
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # connect-src carries the Notes origin for the browser-side
        # `GET {notes}/api/auth/session` that fetches the bearer token — specified in
        # docs/gecko-notes-integration.md and waiting on gecko-notes' side, so it is
        # provisioned rather than in use. Worth saying, because nothing today requests
        # it: dropping it would pass every test and then block that fetch the day it
        # lands, as a console warning nobody is watching.
        #
        # Substituted from NOTES_BASE_URL at container *start*, so it follows the same
        # setting the backend serves from /api/config and `docker compose up -d` is
        # enough to change it — no rebuild. The sign-in redirect is unaffected either
        # way: that is a top-level navigation, which connect-src does not govern.
        #
        # The sha256 is index.html's inline theme script — the one that sets the dark
        # class before first paint. `script-src 'self'` was blocking it, so every
        # dark-mode load in production flashed white and said so only in the console.
        # A hash rather than 'unsafe-inline' keeps the policy strict, and rather than an
        # external file because a blocking request in <head> is the cost the inline
        # script exists to avoid. `csp.test.ts` recomputes it from index.html and fails
        # if the two drift, which is the failure mode a pinned hash otherwise invites.
        #
        # No 'unsafe-eval' here — gecko-notes needs it for BlockNote, GAM has no editor
        # and should not inherit the weaker policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-k5/2A0I5Mwg2n/V9CEukpiKkBRPF23IJ/Ucem02Iz78='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ${NOTES_BASE_URL}; frame-ancestors 'self'";
    }
}
