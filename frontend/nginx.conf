upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `^~` so the static-asset regex below cannot shadow a media URL ending .png/.jpg.
    # Media is authenticated by a signed query parameter, so it must still reach the
    # backend rather than being served off disk.
    location ^~ /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests are what let a long video scrub instead of downloading whole.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # Safe to cache hard: a media key is a UUID and its bytes never change. The
        # signature limits the window, not the content.
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size ${UPLOAD_MAX_SIZE};
        # Stream a large upload straight through instead of spooling it to disk first.
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Hashed filenames, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # connect-src includes the Notes origin because the app calls its
        # /api/auth/session to bootstrap a suite session. No 'unsafe-eval' here —
        # gecko-notes needs it for BlockNote, GAM has no editor and should not
        # inherit the weaker policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://notes.geckopico.com; frame-ancestors 'self'";
    }
}
