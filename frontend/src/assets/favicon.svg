<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GAM's own blue rather than a gecko green: Notes and GAM are routinely open side
       by side, and two green tabs cannot be told apart at 16px. The three primitive
       shapes stand for "assets" in general (any kind of media), and are solid with wide
       gaps because outlines or thin strokes blur into one blob at favicon size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <g fill="#bef264">
    <path d="M32 9 L44 29 L20 29 Z" stroke="#bef264" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="20.5" cy="44" r="10"/>
    <rect x="34" y="34" width="20" height="20" rx="2"/>
  </g>
</svg>
