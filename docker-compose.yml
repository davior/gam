services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
    environment:
      - DATABASE_URL=sqlite:////app/data/db/gam.db
      - MEDIA_DIR=/app/data/media
      # Must match gecko-notes'. GAM verifies the sessions Notes issues; a different
      # secret means every token is rejected. No default — the app refuses to start.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-3600}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JOB_HEARTBEAT_SECONDS=${JOB_HEARTBEAT_SECONDS:-30}
      - JOB_STALE_MINUTES=${JOB_STALE_MINUTES:-40}
    # Never published to the host: the frontend proxies it, and nothing else should
    # reach it directly — ProxyHeadersMiddleware trusts X-Forwarded-* from any peer.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: the container runs migrations before uvicorn binds a port.
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18082}:80"
    environment:
      # Larger than gecko-notes' 1g default: this app exists to hold long video.
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-4g}
    depends_on:
      - backend
    networks:
      - default

networks:
  default:
    name: gam_default
