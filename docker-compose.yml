services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
    environment:
      - DATABASE_URL=sqlite:////app/data/db/gam.db
      - MEDIA_DIR=/app/data/media
      # Must match gecko-notes'. GAM verifies the sessions Notes issues; a different
      # secret means every token is rejected. No default — the app refuses to start.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-3600}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JOB_HEARTBEAT_SECONDS=${JOB_HEARTBEAT_SECONDS:-30}
      - JOB_STALE_MINUTES=${JOB_STALE_MINUTES:-40}
    # Never published to the host: the frontend proxies it, and nothing else should
    # reach it directly — ProxyHeadersMiddleware trusts X-Forwarded-* from any peer.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: the container runs migrations before uvicorn binds a port.
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18082}:80"
    environment:
      # Larger than gecko-notes' 1g default: this app exists to hold long video.
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-4g}
    depends_on:
      - backend
    networks:
      - default

  # Snapshots the database and the media tree to a remote over SFTP. Media filenames
  # are write-once UUIDs, which is what lets restic send only what is new without
  # depending on timestamps. Sources are mounted read-only.
  #
  # Shares a Synology with gecko-notes' backup: distinct BACKUP_SFTP_REMOTE_PATH and a
  # distinct restic --host keep the two repositories' snapshots apart.
  backup:
    build: ./ops/backup
    restart: unless-stopped
    volumes:
      - ./data/db:/backup/src/db:ro
      - ./data/media:/backup/src/media:ro
      - ./ops/backup/secrets/id_backup:/root/.ssh/id_backup:ro
      - ./ops/backup/secrets/known_hosts:/root/.ssh/known_hosts:ro
      - backup_restic_cache:/var/cache/restic
    tmpfs:
      - /backup/tmp
    environment:
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_CACHE_DIR=/var/cache/restic
      - BACKUP_SFTP_HOST=${BACKUP_SFTP_HOST}
      - BACKUP_SFTP_PORT=${BACKUP_SFTP_PORT:-22}
      - BACKUP_SFTP_USER=${BACKUP_SFTP_USER}
      - BACKUP_SFTP_REMOTE_PATH=${BACKUP_SFTP_REMOTE_PATH:-/gam}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 * * * *}
      - BACKUP_KEEP_HOURLY=${BACKUP_KEEP_HOURLY:-48}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-14}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-8}
      - TZ=${TZ:-UTC}
    networks:
      - default

networks:
  default:
    name: gam_default

volumes:
  backup_restic_cache:
