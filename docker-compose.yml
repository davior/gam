services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
    environment:
      - DATABASE_URL=sqlite:////app/data/db/gam.db
      - MEDIA_DIR=/app/data/media
      # Must match gecko-notes'. GAM verifies the sessions Notes issues; a different
      # secret means every token is rejected. No default — the app refuses to start.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Passed only so the app can warn that it is set and no longer read: people sign in
      # at the suite (SUITE_PUBLIC_URL, else SUITE_BASE_URL, below).
      - NOTES_BASE_URL=${NOTES_BASE_URL:-}
      # The Gecko Notes app itself: where the assistant's notes are filed.
      - NOTES_URL=${NOTES_URL:-https://notes.geckopico.com}
      # Where enrichment's model and the embeddings come from: "local" (the providers this
      # app keeps) or "suite" (Gecko Suite). Changing it is a restart, not a rebuild.
      - AI_BACKEND=${AI_BACKEND:-local}
      - SUITE_BASE_URL=${SUITE_BASE_URL:-https://suite.geckopico.com}
      # The suite as browsers reach it, where people sign in; only needed when
      # SUITE_BASE_URL is an internal address. As in Notes.
      - SUITE_PUBLIC_URL=${SUITE_PUBLIC_URL:-}
      # Required when AI_BACKEND=suite; the app refuses to start without it.
      - SUITE_APP_SECRET=${SUITE_APP_SECRET:-}
      - SUITE_EMBEDDING_DIMENSIONS=${SUITE_EMBEDDING_DIMENSIONS:-512}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-3600}
      - DISK_WARN_FREE_GB=${DISK_WARN_FREE_GB:-20}
      - DISK_RESERVE_GB=${DISK_RESERVE_GB:-5}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JOB_HEARTBEAT_SECONDS=${JOB_HEARTBEAT_SECONDS:-30}
      - JOB_STALE_MINUTES=${JOB_STALE_MINUTES:-40}
      - URL_IMPORT_MAX_HEIGHT=${URL_IMPORT_MAX_HEIGHT:-1080}
      - URL_IMPORT_MAX_PLAYLIST_ITEMS=${URL_IMPORT_MAX_PLAYLIST_ITEMS:-200}
      - URL_IMPORT_COOKIES_FILE=${URL_IMPORT_COOKIES_FILE:-}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - GENERATION_CONCURRENCY=${GENERATION_CONCURRENCY:-2}
      - GENERATION_TIMEOUT_MINUTES=${GENERATION_TIMEOUT_MINUTES:-30}
      - GENERATION_POLL_SECONDS=${GENERATION_POLL_SECONDS:-3}
      - GENERATION_MAX_DOWNLOAD_MB=${GENERATION_MAX_DOWNLOAD_MB:-1024}
      - GENERATION_BASE_MAX_EDGE=${GENERATION_BASE_MAX_EDGE:-2048}
      - GENERATION_MAX_DATA_URI_MB=${GENERATION_MAX_DATA_URI_MB:-8}
      - FAL_QUEUE_BASE_URL=${FAL_QUEUE_BASE_URL:-https://queue.fal.run}
      - FAL_API_BASE_URL=${FAL_API_BASE_URL:-https://api.fal.ai}
    # Never published to the host: the frontend proxies it, and nothing else should
    # reach it directly — ProxyHeadersMiddleware trusts X-Forwarded-* from any peer.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: the container runs migrations before uvicorn binds a port.
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18082}:80"
    environment:
      # Larger than gecko-notes' 1g default: this app exists to hold long video.
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-4g}
      # The same values the backend gets: the suite is the CSP's connect-src here (sign-in,
      # the theme picker), so they must agree or the browser's calls are blocked by a
      # policy nobody edited.
      - SUITE_BASE_URL=${SUITE_BASE_URL:-https://suite.geckopico.com}
      - SUITE_PUBLIC_URL=${SUITE_PUBLIC_URL:-}
    depends_on:
      - backend
    networks:
      - default

  # Snapshots the database and the media tree to a remote over SFTP. Media filenames
  # are write-once UUIDs, which is what lets restic send only what is new without
  # depending on timestamps. Sources are mounted read-only.
  #
  # Shares a Synology with gecko-notes' backup: distinct BACKUP_SFTP_REMOTE_PATH and a
  # distinct restic --host keep the two repositories' snapshots apart.
  backup:
    build: ./ops/backup
    restart: unless-stopped
    volumes:
      - ./data/db:/backup/src/db:ro
      - ./data/media:/backup/src/media:ro
      - ./ops/backup/secrets/id_backup:/root/.ssh/id_backup:ro
      - ./ops/backup/secrets/known_hosts:/root/.ssh/known_hosts:ro
      - backup_restic_cache:/var/cache/restic
    tmpfs:
      - /backup/tmp
    environment:
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_CACHE_DIR=/var/cache/restic
      - BACKUP_SFTP_HOST=${BACKUP_SFTP_HOST}
      - BACKUP_SFTP_PORT=${BACKUP_SFTP_PORT:-22}
      - BACKUP_SFTP_USER=${BACKUP_SFTP_USER}
      - BACKUP_SFTP_REMOTE_PATH=${BACKUP_SFTP_REMOTE_PATH:-/GAM/restic}
      # Empty leaves the plain-file mirror off; restic runs either way.
      - BACKUP_MIRROR_PATH=${BACKUP_MIRROR_PATH:-}
      # Parallel SFTP connections, and an optional upload cap in KiB/s (empty = none).
      - BACKUP_SFTP_CONNECTIONS=${BACKUP_SFTP_CONNECTIONS:-2}
      - BACKUP_LIMIT_UPLOAD_KBPS=${BACKUP_LIMIT_UPLOAD_KBPS:-}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 * * * *}
      - BACKUP_KEEP_HOURLY=${BACKUP_KEEP_HOURLY:-48}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-14}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-8}
      - TZ=${TZ:-UTC}
    networks:
      - default

networks:
  default:
    name: gam_default

volumes:
  backup_restic_cache:
